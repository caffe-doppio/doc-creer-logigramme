<title id="titre">Catalogue des formes ISO 5807 du skill</title>
<desc id="description">Planche de quinze symboles de logigramme rangés en trois rangées de cinq. Première rangée : terminal en forme de stade, traitement rectangulaire, décision en losange, entrée ou sortie en parallélogramme, processus prédéfini à doubles bords verticaux. Deuxième rangée : connecteur de page en petit cercle marqué A, renvoi hors page en pentagone marqué B, annotation en crochet ouvert, fichier ou base en cylindre, document à base ondulée. Troisième rangée : documents multiples empilés, opération manuelle en trapèze, saisie manuelle au bord supérieur incliné, préparation en hexagone, mode parallèle en deux traits horizontaux.</desc>
<defs>
