<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1314 1074" width="1314" height="1074" role="img" aria-labelledby="titre description" data-logigramme="1" data-variante="light">
<title id="titre">Traitement d'un incident de sécurité, en trois couloirs</title>
<desc id="description">Logigramme en dix symboles, répartis en trois couloirs verticaux : la personne qui constate, le DPO, le responsable du traitement. La personne qui constate un incident le signale au DPO. Le DPO qualifie l'incident : si ce n'est pas une violation de données, l'incident est classé. Si c'en est une, le DPO l'inscrit au registre des violations, puis évalue le risque pour les personnes. Sans risque, le dossier est clos. Avec un risque, le responsable du traitement notifie la CNIL, puis le dossier est clos. Une annotation rappelle que la notification se fait sous 72 heures après la prise de connaissance.</desc>
<defs>
