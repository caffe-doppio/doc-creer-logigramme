<text class="titre-couloir" x="532" y="50.8" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">DPO</text>
