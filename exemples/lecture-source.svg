<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 739 952" width="739" height="952" role="img" aria-labelledby="titre description" data-logigramme="1" data-variante="light">
<title id="titre">Du processus au modèle</title>
<desc id="description">Logigramme en dix symboles, premier de deux. Le processus à schématiser arrive sous forme de description, de schéma existant ou de code. Les étapes, les décisions et leurs issues sont relevées. Si la source est illisible ou incomplète, une question est posée à l'humain et le relevé reprend avec sa réponse. Si elle est complète, le nombre de symboles est évalué : au-delà de vingt-cinq, un découpage en plusieurs schémas est proposé avant d'écrire le modèle. Le modèle JSON et son texte alternatif sont écrits, puis un renvoi hors page mène au second schéma, le tracé et la vérification. Une annotation rappelle qu'aucune donnée personnelle réelle n'entre dans un libellé.</desc>
