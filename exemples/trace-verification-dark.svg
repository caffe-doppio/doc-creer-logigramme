<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 751 952" width="751" height="952" role="img" aria-labelledby="titre description" data-logigramme="1" data-variante="dark">
<title id="titre">Tracé, vérification et remise</title>
<desc id="description">Logigramme en onze symboles, second de deux. Il part du renvoi hors page venu du premier schéma. Le script tracer.py lit le modèle. S'il rend le code 2, modèle invalide ou texte trop long, le modèle est corrigé et retracé. S'il rend le code 3, SVG déjà présents, l'accord de l'humain est demandé avant de remplacer. S'il rend le code 0, le script verifier.py contrôle la paire de SVG et le snippet. En cas d'erreur, si trois essais ont déjà eu lieu sur le même point, le travail s'arrête et la décision revient à l'humain ; sinon le modèle est corrigé et retracé. Sans erreur, la remise liste les fichiers, le snippet et les avertissements maintenus, et le logigramme est remis.</desc>
