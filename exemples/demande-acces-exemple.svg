<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 739 1379" width="739" height="1379" role="img" aria-labelledby="titre description" data-logigramme="1" data-variante="light">
<title id="titre">Traitement d'une demande d'accès aux données</title>
<desc id="description">Logigramme en neuf étapes. Une demande d'accès arrive par courriel ou formulaire, un dossier est ouvert et horodaté, puis l'identité du demandeur est contrôlée. Si elle n'est pas établie, un justificatif proportionné est demandé et la demande revient au point de réception. Si elle l'est, deux traitements menés en parallèle, l'extraction depuis le registre et l'interrogation des sous-traitants, se rejoignent avant une relecture manuelle qui occulte les données de tiers. La réponse est envoyée avec la copie des données, et la demande est close. Une annotation rappelle le délai d'un mois, prorogeable de deux mois.</desc>
<defs>
